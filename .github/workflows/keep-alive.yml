name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -f \
            -A "Mozilla/5.0 (compatible; Lobo24KeepAlive/1.0)" \
            https://lobo24-backend.onrender.com/
